<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azure Flutter</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Google Fonts: Libertinus Serif -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libertinus+Serif:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Nhạc nền ẩn (Sẽ phát khi bấm nút Đi chợ lựa chồng) -->
    <audio id="bg-music" loop>
        <source src="playlist.mp3" type="audio/mpeg">
    </audio>

    <!-- Màn hình chào mừng (Intro) -->
    <section id="intro-screen">
        <!-- Đã đóng thẻ sparkles cẩn thận -->
        <div class="sparkles">
            <span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span>
        </div>
        
        <div class="stars"></div>
        <div class="intro-content">
            <div class="musical-icon">𑣲𝄞</div>
            <h1 class="title">Azure Flutter</h1>
            <p class="subtitle">Đôi cánh tàn trên con sóng chiều tà.</p>
            <p class="welcome-text">Welcome to your boyfriend world.</p>
            <button id="btn-enter">ĐI CHỢ LỰA CHỒNG</button>
        </div>
    </section>

    <!-- Nội dung chính (Ẩn lúc đầu, hiện sau khi bấm nút) -->
    <main id="main-content" class="hidden">
        <header class="profile-header">
            <div class="avatar-container">
                <img src="avatar.jpg" alt="Avatar" class="avatar">
            </div>
            <h2>Céline Adeline Allen</h2>
            <p class="bio">𝄞⨾nơi những nốt nhạc được ngân nga✮˚.⋆</p>
        </header>

        <!-- Gian hàng chồng yêu -->
        <section class="gallery-container">
            <h3>✦ GIAN HÀNG CHỒNG YÊU ✦</h3>
            
            <div class="cards-grid">
                <!-- Thẻ nhân vật 1 -->
                <div class="card">
                    <a href="https://aistudio.google.com/app/prompts/17XszDKBU2Ws6kojreIdoBRtv8WUZFasf" target="_blank">
                        <img src="louis.jpg" alt="𝙻𝚘𝚞𝚒𝚜 𝚁𝚊𝚙𝚑𝚊𝚎̈𝚕 𝙱𝚎𝚊𝚞𝚖𝚘𝚗𝚝" class="card-img">
                    </a>

                    <div class="card-info">
                        <h4>
                            <a href="https://aistudio.google.com/app/prompts/17XszDKBU2Ws6kojreIdoBRtv8WUZFasf" target="_blank" class="char-link">
                                𝙻𝚘𝚞𝚒𝚜 𝚁𝚊𝚙𝚑𝚊𝚎̈𝚕 𝙱𝚎𝚊𝚞𝚖𝚘𝚗𝚝
                            </a>
                        </h4>
                        <p class="quote">"Em… dại… an… nối… tiếc… Việtt… nhéee?"</p>
                        <div class="tags">
                            <span>#HiệnĐại</span>
                            <span>#Cún</span>
                            <span>#BG</span>
                            <span>#Ngọt</span>
                            <span>#AgeGap</span>
                            <span>#SizeGap</span>
                            <span>#RacingBoy</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
