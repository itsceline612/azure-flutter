<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azure Flutter</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Google Fonts: Libertinus Serif -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libertinus+Serif:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Nhạc nền ẩn -->
    <audio id="bg-music" loop>
        <source src="playlist.mp3" type="audio/mpeg">
    </audio>

    <!-- Khung 2 cánh cửa mở ra -->
    <div id="door-container">
        <div class="door door-left"></div>
        <div class="door door-right"></div>
    </div>

    <!-- Màn hình chào mừng (Intro) -->
    <section id="intro-screen">
        <div class="sparkles">
            <span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span>
        </div>
        
        <div class="stars"></div>
        <div class="intro-content">
            <div class="musical-icon">𝄞⨾💿✮˚.⋆</div>
            <h1 class="title">Azure Flutter</h1>
            <p class="subtitle">Đôi cánh tàn trên cơn sóng chiều tà.</p>
            <p class="welcome-text">Welcome to your boyfriend world.</p>
            <button id="btn-enter">ĐI CHỢ LỰA CHỒNG</button>
        </div>
    </section>

    <!-- Nội dung chính -->
    <main id="main-content" class="hidden">
        <header class="profile-header">
            <div class="avatar-container">
                <img src="avatar.jpg" alt="Avatar" class="avatar">
            </div>
            <h2>Céline Adeline Allen</h2>
            <p class="bio">𝄞⨾nơi những nốt nhạc được ngân nga✮˚.⋆</p>
        </header>

        <!-- Thanh Menu Tab -->
        <nav class="nav-tabs">
            <span class="tab-item active">✦ Gian hàng chồng yêu ✦</span>
            <a href="https://www.facebook.com/itsceline6" target="_blank" class="tab-item">Tác giả ▾</a>
        </nav>

        <!-- Gian hàng chồng yêu -->
        <section class="gallery-container">   
            <!-- Khung trống này để JS tự động đổ danh sách từ characters.json vào -->
            <div class="cards-grid" id="character-list"></div>
        </section>
    </main>

    <!-- CỬA SỔ POP-UP (MODAL) -->
    <div id="plot-modal" class="modal-overlay">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            
            <h3 class="modal-title">Tên Nhân Vật</h3>
            
            <!-- Ô hiển thị Plot tự động tải từ file .txt -->
            <div class="plot-container" id="plot-text">
                <p>Đang tải nội dung câu chuyện...</p>
            </div>

            <div class="modal-footer">
                <a href="#" target="_blank" class="btn-chat">
                    CHAT VỚI CHỒNG IU ➔
                </a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
